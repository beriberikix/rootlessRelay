services:
  relay:
    build: .
    ports:
      # Public WebSocket + /healthz + anonymous token endpoint (plain WS; put
      # TLS termination in front of it).
      - "8086:8086"
      # Operator admin UI and /metrics: published to the host loopback only.
      # Reach it through an SSH tunnel; do not expose it publicly.
      - "127.0.0.1:8001:8001"
    # Values are read from a .env file next to this compose.yml (see .env.example).
    environment:
      RELAY_MODE: ${RELAY_MODE:-hosted}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env}
      ANON_TOKEN_SECRET: ${ANON_TOKEN_SECRET:-}
      ANON_ENABLED: ${ANON_ENABLED:-true}
      # Only needed on first start, to create the initial operator.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_TRUST_PROXY: ${ADMIN_TRUST_PROXY:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      TIERS_JSON: ${TIERS_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-0}
    volumes:
      - relay_data:/data
    restart: unless-stopped

volumes:
  relay_data:
