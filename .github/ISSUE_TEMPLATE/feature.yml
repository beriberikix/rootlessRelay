name: Feature request
description: Something the relay should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: upstream
    attributes:
      label: Does it apply to upstream obegron/rootlessRelay too?
      options:
        - "Yes"
        - "No, hosted mode only"
        - Not sure
