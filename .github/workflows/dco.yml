name: dco

# Developer Certificate of Origin (https://developercertificate.org): every
# commit in a pull request needs a "Signed-off-by: Name <email>" line whose
# email matches the commit's author. `git commit -s` adds it. See
# CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            case "$email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -i "^Signed-off-by:" | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by for <$email>"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff $BASE' to fix existing commits), then push again."
            exit 1
          fi
          echo "all commits signed off"
