name: release

# On a published release:
# 1. The tag must match package.json at the tagged commit (v + version), so
#    deployers that pin the tarball see the version they asked for. Bump
#    "version" in the PR that goes into a release.
# 2. Attach the npm package (npm pack), a CycloneDX SBOM of its production
#    dependencies, and a build-provenance attestation for the package.
#    Deployers depend on the attached tarball, not GitHub's generated
#    source archive, which is not guaranteed to stay byte-identical.

on:
  release:
    types: [published]
  # Attach the assets to an existing release, e.g. one made before this
  # workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.7.0-hosted.12)
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release $TAG but package.json says $version; bump \"version\" before tagging"
            exit 1
          fi
          echo "$TAG matches package.json"

  assets:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Pack and SBOM
        id: pack
        run: |
          tgz=$(npm pack --ignore-scripts --silent)
          sbom="${tgz%.tgz}.cdx.json"
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "$sbom"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          echo "$tgz integrity: sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tgz }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          SBOM: ${{ steps.pack.outputs.sbom }}
        run: gh release upload "$TAG" "$TGZ" "$SBOM" --clobber
